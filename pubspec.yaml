name: voyager
description: Local-first journaling and productivity app.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  uuid: ^4.5.1
  drift: ^2.26.0
  sqlite3_flutter_libs: ^0.5.34
  path_provider: ^2.1.5
  path: ^1.9.1
  fl_chart: ^0.70.2
  collection: ^1.19.1
  hotkey_manager: ^0.2.3
  intl: ^0.20.2
  http: ^1.4.0
  url_launcher: ^6.3.1
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.3
  cloud_firestore: ^6.6.0
  cloud_functions: ^6.3.3
  phosphoricons_flutter: ^1.0.0
  oauth2: ^2.0.5
  window_manager: ^0.4.3
  archive: ^3.6.1
  file_picker: ^8.1.7
  flutter_code_editor: ^0.3.5
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  flutter_math_fork: ^0.7.4
  # Held at 13.4.3, not the latest. 13.4.4 declares
  # `firebase_core_platform_interface: ^7.1.0` but its code extends
  # `FirebasePlugin`, a symbol that only exists from 8.0.0 — so it resolves
  # cleanly and then fails to compile. 13.4.5+ fix the constraint but require
  # firebase_core_platform_interface 8.x, which would drag cloud_firestore,
  # cloud_functions and firebase_auth up with it — and firebase_auth is the
  # locally patched fork in third_party/. Revisit together with that fork.
  firebase_storage: 13.4.3
  image: ^4.3.0
  super_clipboard: ^0.9.1
  super_drag_and_drop: ^0.9.1
  crypto: ^3.0.7
  tray_manager: ^0.5.3
  win32: ^5.15.0
  win32_registry: ^2.1.0
  ffi: ^2.2.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  flutter_map_marker_cluster: ^8.2.2
  vector_map_tiles: 9.0.0-beta.9
  vector_tile_renderer: ^6.1.0
  geolocator: ^14.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.26.0
  fake_cloud_firestore: any
  # Already present transitively via flutter_test; declared so the
  # connectivity probe's timer schedule can be tested in fake time.
  fake_async: any

# firebase_auth's stock Windows plugin sends IdTokenListener/AuthStateListener
# callbacks to the Flutter engine from whatever thread the Firebase Auth SDK
# fires them on, violating platform-channel threading rules — a known,
# currently unfixed upstream bug (firebase/flutterfire#17800, #11933,
# #16888). This locally patches windows/firebase_auth_plugin.cpp to marshal
# those callbacks onto the platform thread, matching the pattern
# cloud_firestore's own Windows plugin already uses. It also fixes
# reauthenticateWithCredential, which upstream never completes on success
# (Settings > Change password depends on it). Re-apply the patches (see
# third_party/firebase_auth-6.5.3/windows/firebase_auth_plugin.cpp) if
# upgrading firebase_auth past 6.5.3, and drop this override once upstream
# fixes it.
#
# vector_tile_renderer draws a street name whose exact text box collides
# with another label anyway, at its estimated position and without reserving
# the space, so street names overlap on the rankings map; it reserves a
# street name's upright bounding box, which on an angled grid blocks the
# block beside it, and pads every label by a margin in tile units, 32-64
# pixels at 16x overzoom, so restaurant names find no room; it clips an
# overzoomed tile's geometry to the tile's exact square, so wide roads lose
# bites at tile edges; and it drops a label that does not fit whole inside
# the tile being drawn, so past the tiles' last zoom a third of the names are
# missing, a different third at each zoom. The local copy fixes all four, in
# lib/src/features/symbol_line_renderer.dart,
# lib/src/features/label_space.dart,
# lib/src/model/transform/tile_clip.dart and
# lib/src/features/label_layout.dart, with renderer.dart, text_renderer.dart,
# themes/style.dart and themes/theme_reader.dart (marked VOYAGER PATCH);
# 7.0.0-beta.1 has the same bugs. It also reads `symbol-sort-key`, which
# upstream ignores, so the best ranked restaurant names win the room
# (style.dart, theme_reader.dart, model/tile_factory.dart, label_layout.dart). Re-apply them if upgrading past 6.1.0, and
# drop this override once upstream fixes them.
#
# flutter_map shows each tile of a new zoom as soon as it loads, beside the
# old zoom's tiles scaled up, so on the rankings map roads change width from
# tile to tile until the last one arrives. The local copy holds a zoom's tiles
# back until all of them on screen have loaded and swaps them in together
# (lib/src/layer/tile_layer/tile_image_view.dart, with tile_image.dart and
# tile_layer.dart; marked VOYAGER PATCH). Re-apply it if upgrading past
# 8.3.2.
#
# vector_map_tiles keeps a drawn tile only on disk, so one that leaves the
# rankings map and comes back is read and decoded again; holds a new tile back
# until its PNG is written, and every 20th behind a scan of the whole cache
# folder; and draws every tile whose data has arrived back to back on the UI
# thread, freezing a pan. The local copy keeps drawn tiles in memory, writes
# them in the background and spreads the drawing over frames, in
# lib/src/raster/tile_loader.dart, lib/src/cache/caches.dart and
# lib/src/cache/storage_cache.dart (marked VOYAGER PATCH). It also hands each
# overzoomed tile the label layout of its source tile (the renderer's
# label_layout.dart), in tile_loader.dart, raster_tile_provider.dart and
# lib/src/rendering/tile_renderer.dart. And upstream decodes a whole source
# tile again for every overzoomed tile cut from it, on isolates that share
# the UI's heap, so collecting that garbage stalled the UI for up to half a
# second while tiles loaded; the local copy sends a source tile's cuts to one
# isolate that keeps it decoded, in lib/src/cache/vector_tile_loading_cache.dart,
# and runs four isolates however many tiles may be in flight, in
# lib/src/grid/grid_layer.dart. And a whole tile is tens of milliseconds of
# drawing in one go; the local copy draws it a piece at a time over frames
# (tile_loader.dart and tile_renderer.dart, with the renderer's renderer.dart,
# themes/theme.dart and themes/theme_layers.dart) and no longer makes every
# path up front (raster_tile_provider.dart). And the labels of a theme layer
# whose metadata sets `overlay` are placed but not drawn into the tiles: its
# controller hands them over (vector_tile_controller.dart, tile_loader.dart,
# with the renderer's label_layout.dart), so the rankings map draws
# restaurant names itself, hides one under a pin and lets one be pressed.
# Re-apply them if upgrading past
# 9.0.0-beta.9.
#
# flutter_map_marker_cluster, pressed on a cluster whose pins never part,
# moves to the camera's zoom rounded up before fanning the pins out, and then
# closes them again because the zoom changed: between two whole zooms the
# press only zooms in, and it takes a second to open the cluster. The local
# copy stays at the camera's zoom (lib/src/marker_cluster_layer.dart, marked
# VOYAGER PATCH). Re-apply it if upgrading past 8.2.2.
dependency_overrides:
  firebase_auth:
    path: third_party/firebase_auth-6.5.3
  flutter_map:
    path: third_party/flutter_map-8.3.2
  flutter_map_marker_cluster:
    path: third_party/flutter_map_marker_cluster-8.2.2
  vector_tile_renderer:
    path: third_party/vector_tile_renderer-6.1.0
  vector_map_tiles:
    path: third_party/vector_map_tiles-9.0.0-beta.9

flutter:
  uses-material-design: true
  shaders:
    - shaders/geometric_texture.frag
    - shaders/paper_texture.frag
  assets:
    - assets/quotes.json
    - assets/rankings_map_style.json
    - assets/dictionary_en.txt
    - assets/app_icon.ico
  fonts:
    - family: IosevkaAile
      fonts:
        - asset: assets/Iosevka-Thin/Iosevka-Aile-Light-01.ttf
          weight: 300
        - asset: assets/Iosevka-Thin/Iosevka-Aile-Light-Italic-03.ttf
          weight: 300
          style: italic
        - asset: assets/Iosevka-Regular/Iosevka-Aile-01.ttf
          weight: 400
        - asset: assets/Iosevka-Regular/Iosevka-Aile-Italic-03.ttf
          weight: 400
          style: italic
        - asset: assets/Iosevka-Bold/Iosevka-Aile-Bold-01.ttf
          weight: 700
        - asset: assets/Iosevka-Bold/Iosevka-Aile-Bold-Italic-03.ttf
          weight: 700
          style: italic
    # Monospace sibling of Aile, used only by the LeetCode code block. Subset
    # to Latin/Greek/Cyrillic plus punctuation, math, arrows and box drawing —
    # the full faces are ~10 MB each. Regenerate with tool/subset_mono_font.py.
    - family: IosevkaMono
      fonts:
        - asset: assets/Iosevka-Regular/Iosevka-Term-01.ttf
          weight: 400
        - asset: assets/Iosevka-Regular/Iosevka-Term-Italic-03.ttf
          weight: 400
          style: italic
